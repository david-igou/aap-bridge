apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - aap-bridge-serviceaccount.yaml
  - aap-bridge-api-deployment.yaml
  - aap-bridge-api-service.yaml
  - aap-bridge-data-pvc.yaml
  - aap-bridge-ui-deployment.yaml
  - aap-bridge-ui-service.yaml
  - aap-bridge-route.yaml
configMapGenerator:
  - name: aap-bridge-config
    files:
      - config.yaml
  - name: aap-bridge-nginx
    files:
      - nginx.conf
