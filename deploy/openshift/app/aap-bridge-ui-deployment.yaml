apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-bridge-ui
  labels:
    app.kubernetes.io/name: aap-bridge-ui
    app.kubernetes.io/part-of: aap-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-bridge-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-bridge-ui
        app.kubernetes.io/part-of: aap-bridge
      annotations:
        alpha.image.policy.openshift.io/resolve-names: '*'
    spec:
      serviceAccountName: aap-bridge
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: aap-bridge-ui:deployed
          imagePullPolicy: Always
          command:
            - nginx
          args:
            - -e
            - /dev/stderr
            - -g
            - daemon off;
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx
          configMap:
            name: aap-bridge-nginx
        - name: tmp
          emptyDir: {}
