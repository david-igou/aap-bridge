apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: aap-bridge
  annotations:
    haproxy.router.openshift.io/timeout: 300s
    haproxy.router.openshift.io/timeout-tunnel: 24h
spec:
  to:
    kind: Service
    name: aap-bridge-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
