apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-bridge-postgresql
  labels:
    app.kubernetes.io/name: aap-bridge-postgresql
    app.kubernetes.io/part-of: aap-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-bridge-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-bridge-postgresql
        app.kubernetes.io/part-of: aap-bridge
    spec:
      serviceAccountName: aap-bridge
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: aap-bridge-db
                  key: POSTGRESQL_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aap-bridge-db
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: aap-bridge-db
                  key: POSTGRESQL_DATABASE
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - exec pg_isready -h 127.0.0.1 -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - exec pg_isready -h 127.0.0.1 -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgresql
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aap-bridge-postgresql
